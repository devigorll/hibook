<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0c">

  <meta
    name="description"
    content="HiBook: organize sua biblioteca de livros e crie listas personalizadas."
  >

  <title>HiBook — Galeria Visual de Livros</title>

  <!-- Aplica o tema antes do primeiro desenho (evita piscar entre claro e escuro) -->
  <script src="./js/theme_boot.js"></script>

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/details.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/notes.css">

  <!-- Ícones (versão fixa para o projeto não quebrar em atualizações) -->
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>

<!-- "booting": tela neutra (sem menu) até saber se há alguém logado -->
<body class="booting">
  <div id="app">

    <!-- Menu lateral -->
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="sidebar-brand">
        <i data-lucide="book-open-check" aria-hidden="true"></i>
        <span class="brand-text">HiBook</span>

        <!-- Só aparece no celular, com o menu aberto -->
        <button type="button" class="icon-btn sidebar-close" id="sidebar-close-btn" aria-label="Fechar menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <nav aria-label="Navegação da biblioteca">
        <ul class="sidebar-menu">

          <li class="menu-item active" data-view="gallery" tabindex="0" role="button" aria-current="page">
            <i data-lucide="layout-grid" aria-hidden="true"></i>
            <span class="menu-text">Início</span>
          </li>

          <li class="menu-item" data-view="create-book" tabindex="0" role="button">
            <i data-lucide="plus-circle" aria-hidden="true"></i>
            <span class="menu-text">Criar Livro</span>
          </li>

          <li class="menu-item" data-view="create-list" tabindex="0" role="button">
            <i data-lucide="folder-plus" aria-hidden="true"></i>
            <span class="menu-text">Criar Lista</span>
          </li>

        </ul>
      </nav>

      <div class="menu-section-title">Minhas Listas</div>

      <ul class="sidebar-lists-container" id="sidebar-lists" aria-label="Minhas listas">
        <!-- Listas carregadas pelo JavaScript -->
      </ul>

      <!-- Rodapé: aparece somente com o usuário logado -->
      <div class="sidebar-footer" id="sidebar-footer" hidden>
        <button type="button" class="menu-item" id="logout-btn">
          <i data-lucide="log-out" aria-hidden="true"></i>
          <span class="menu-text">Sair</span>
        </button>
      </div>
    </aside>

    <!-- Fundo escuro atrás do menu aberto no celular (tocar nele fecha o menu) -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Conteúdo principal -->
    <main class="main-content" id="main-content">

      <header class="main-header">
        <div class="header-title-container">

          <button
            id="toggle-sidebar-btn"
            class="icon-btn"
            type="button"
            aria-label="Abrir ou fechar menu"
            aria-controls="sidebar"
            aria-expanded="true"
          >
            <i data-lucide="menu" aria-hidden="true"></i>
          </button>

          <h2 id="page-title">Biblioteca Geral</h2>

        </div>

        <!-- Ações do cabeçalho: o seletor de tema é inserido aqui pelo app.js -->
        <div class="header-actions" id="header-actions"></div>
      </header>

      <section id="content-area" aria-live="polite">
        <div class="empty-state">
          <i data-lucide="book-open" aria-hidden="true"></i>
          <h3>Carregando...</h3>
        </div>
      </section>

    </main>

  </div>
</body>
</html>
